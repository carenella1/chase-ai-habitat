{% extends "base.html" %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">

<div class="chat-layout">

    <!-- MAIN CHAT -->
    <div class="chat-main chat-panel">

        <div class="chat-panel-header">
            <div class="chat-header-left">
                <span class="chat-nex-name" id="chat-nex-name">NEXARION</span>
                <span class="chat-cycle-pill" id="chat-cycle-pill"></span>
            </div>
            <div class="chat-header-right">
                <button id="trace-toggle-btn" class="chat-btn chat-btn-trace" title="Toggle thinking trace">
                    <span class="trace-icon">◈</span> TRACE <span class="trace-state">OFF</span>
                </button>
            </div>
        </div>

        <div id="chat-thread"></div>

        <div class="chat-input-area">
            <input id="chat-input" placeholder="Speak to Nexarion..." />
            <button id="send-btn" class="chat-btn primary">Send</button>
            <button id="mic-btn" class="chat-btn" title="Voice input">🎤</button>
            <div class="volume-control" title="Nex voice volume">
                <span class="volume-icon" id="volume-icon">🔊</span>
                <input type="range" id="volume-slider" min="0" max="100" value="80" aria-label="Nex voice volume" />
            </div>
            <button id="mode-toggle" class="chat-btn" title="Nex Live">Nex Live</button>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="chat-right-panel">
        <div class="panel">
            <h3 class="panel-title">Conversations</h3>
            <button id="new-chat-btn" class="chat-btn" style="margin-bottom:10px;width:100%;">
                + New Chat
            </button>
            <div id="chat-list"></div>
        </div>

        <!-- LIVE CONTEXT PANEL -->
        <div class="panel" id="live-context-panel" style="margin-top:14px">
            <h3 class="panel-title">Live Context</h3>
            <div class="ctx-row">
                <span class="ctx-label">CYCLE</span>
                <span class="ctx-val" id="ctx-cycle">—</span>
            </div>
            <div class="ctx-row">
                <span class="ctx-label">ACTIVE GOAL</span>
                <span class="ctx-val ctx-goal" id="ctx-goal">—</span>
            </div>
            <div class="ctx-row">
                <span class="ctx-label">TOP TOPIC</span>
                <span class="ctx-val" id="ctx-topic">—</span>
            </div>
            <div class="ctx-row">
                <span class="ctx-label">BELIEFS HELD</span>
                <span class="ctx-val" id="ctx-beliefs">—</span>
            </div>
            <div class="ctx-row">
                <span class="ctx-label">DOMAIN</span>
                <span class="ctx-val" id="ctx-domain">—</span>
            </div>
        </div>
    </div>

</div>

<!-- NEX LIVE OVERLAY -->
<div id="orb-overlay">

    <div id="orb-rings">
        <div class="orb-ring ring-1"></div>
        <div class="orb-ring ring-2"></div>
        <div class="orb-ring ring-3"></div>
    </div>

    <div id="nexarion-orb" class="nf-face" data-state="idle">
        <svg class="nf-svg" viewBox="0 0 200 200">
            <polygon class="nf-plate-outer" points="100,14 165,50 178,100 165,150 100,186 35,150 22,100 35,50"/>
            <polygon class="nf-plate-inner" points="100,32 152,60 162,100 152,140 100,168 48,140 38,100 48,60"/>
            <line class="nf-bridge-line" x1="83" y1="98" x2="93" y2="98"/>
            <line class="nf-bridge-line" x1="107" y1="98" x2="117" y2="98"/>
            <circle class="nf-bridge-node" cx="100" cy="98" r="2.6"/>
            <rect class="nf-eye nf-eye-l" x="66" y="88" width="16" height="7" rx="1"/>
            <rect class="nf-eye nf-eye-r" x="118" y="88" width="16" height="7" rx="1"/>
            <line class="nf-mbase" x1="72" y1="140" x2="128" y2="140"/>
            <rect class="nf-mbar" x="73" y="128" width="4" height="12"/>
            <rect class="nf-mbar" x="82" y="128" width="4" height="12"/>
            <rect class="nf-mbar" x="91" y="128" width="4" height="12"/>
            <rect class="nf-mbar" x="100" y="128" width="4" height="12"/>
            <rect class="nf-mbar" x="109" y="128" width="4" height="12"/>
            <rect class="nf-mbar" x="118" y="128" width="4" height="12"/>
            <rect class="nf-mbar" x="123" y="128" width="4" height="12"/>
        </svg>
    </div>

    <div id="orb-status-text">Nexarion is ready</div>

    <div id="orb-response-text"></div>

    <div id="orb-hint">Tap Nex or use the mic to speak</div>

    <button id="exit-orb" class="chat-btn">&#x2715; Exit Nex Live</button>

</div>

{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/chat.js"></script>
{% endblock %}
