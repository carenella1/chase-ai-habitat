<!DOCTYPE html>
<html>
<head>
    <title>Chase AI Habitat</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/nex_face.css">
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
<div id="particle-background"></div>
<div class="app-container">
    <div class="sidebar">
        <h2 class="logo">CHASE AI HABITAT</h2>
        <nav>
            <a href="/chat" class="{% if active == 'chat' %}active{% endif %}">Chat</a>
            <a href="/creative" class="{% if active == 'creative' %}active{% endif %}">Creative <span class="nav-dot" id="creative-nav-dot" style="display:none;"></span></a>
            <a href="/discovery" class="{% if active == 'discovery' %}active{% endif %}">Discovery</a>
            <a href="/memory" class="{% if active == 'memory' %}active{% endif %}">Memory &amp; Beliefs</a>
            <a href="/self" class="{% if active == 'self' %}active{% endif %}">Self</a>
            <a href="/journal" class="{% if active == 'journal' %}active{% endif %}">Journal</a>
            <a href="/digest" class="{% if active == 'digest' %}active{% endif %}">Digest <span class="nav-dot" id="digest-nav-dot" style="display:none;"></span></a>
            <a href="/eval" class="{% if active == 'eval' %}active{% endif %}">Report Card</a>
            <a href="/how-it-works" class="{% if active == 'how_it_works' %}active{% endif %}">How Nex Works</a>
            <a href="/settings" class="{% if active == 'settings' %}active{% endif %}">Settings</a>
        </nav>
    </div>
    <div class="main-content">
        <div class="page-shell">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<div id="nex-face-widget" class="nf-face" data-state="idle" role="button" tabindex="0" aria-label="Open Nex Live" title="Nex">
    <svg class="nf-svg" width="78" height="78" viewBox="0 0 200 200">
        <polygon class="nf-plate-outer" points="100,14 165,50 178,100 165,150 100,186 35,150 22,100 35,50"/>
        <polygon class="nf-plate-inner" points="100,32 152,60 162,100 152,140 100,168 48,140 38,100 48,60"/>
        <line class="nf-bridge-line" x1="83" y1="98" x2="93" y2="98"/>
        <line class="nf-bridge-line" x1="107" y1="98" x2="117" y2="98"/>
        <circle class="nf-bridge-node" cx="100" cy="98" r="2.6"/>
        <rect class="nf-eye nf-eye-l" x="66" y="88" width="16" height="7" rx="1"/>
        <rect class="nf-eye nf-eye-r" x="118" y="88" width="16" height="7" rx="1"/>
        <line class="nf-mbase" x1="72" y1="140" x2="128" y2="140"/>
        <rect class="nf-mbar" x="73" y="128" width="4" height="12"/>
        <rect class="nf-mbar" x="82" y="128" width="4" height="12"/>
        <rect class="nf-mbar" x="91" y="128" width="4" height="12"/>
        <rect class="nf-mbar" x="100" y="128" width="4" height="12"/>
        <rect class="nf-mbar" x="109" y="128" width="4" height="12"/>
        <rect class="nf-mbar" x="118" y="128" width="4" height="12"/>
        <rect class="nf-mbar" x="123" y="128" width="4" height="12"/>
    </svg>
</div>

<script src="/static/js/background_particles.js"></script>
<script src="/static/js/info_tooltip.js"></script>
<script src="/static/js/digest_indicator.js"></script>
<script src="/static/js/creative_indicator.js"></script>
<script src="/static/js/nex_face.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
